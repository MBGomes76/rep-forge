framework:
    secret: '%env(APP_SECRET)%'

    # Cookie de session longue durée (90 jours), invisible pour le JavaScript.
    # SameSite=Lax : le cookie n'est pas envoyé par les requêtes d'un autre site.
    session:
        name: repforge_session
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
        cookie_lifetime: 7776000
        gc_maxlifetime: 7776000
        cookie_httponly: true
        cookie_secure: auto
        cookie_samesite: lax

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file