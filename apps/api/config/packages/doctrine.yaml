# Deux connexions, deux rôles PostgreSQL (moindre privilège, voir docs/decisions/0008) :
# - default : l'application, lecture et écriture des données seulement ;
# - admin : propriétaire du schéma, utilisée uniquement par les migrations.
doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                # La séquence des révisions est créée par migration, hors des entités.
                schema_filter: '~^(?!document_revision_seq$)~'
                profiling_collect_backtrace: '%kernel.debug%'
            admin:
                url: '%env(resolve:DATABASE_ADMIN_URL)%'
                schema_filter: '~^(?!document_revision_seq$)~'
    orm:
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                naming_strategy: doctrine.orm.naming_strategy.underscore
                mappings: &mappings
                    App:
                        type: xml
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/Mapping'
                        prefix: 'App\Domain'
            # Mêmes entités, connexion admin : c'est ce gestionnaire que les migrations utilisent.
            admin:
                connection: admin
                naming_strategy: doctrine.orm.naming_strategy.underscore
                mappings: *mappings

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'
                admin:
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                default:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
    framework:
        cache:
            pools:
                doctrine.system_cache_pool:
                    adapter: cache.system
